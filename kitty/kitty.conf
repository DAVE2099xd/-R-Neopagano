# Tipografía
font_family      JetBrainsMono Nerd Font
font_size        14.0
disable_ligatures never

# Interfaz de ventana
window_padding_width 15
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.85

# Colores base
background #0f052d
foreground #c0caf5

# Cursor y selección
cursor #5fc75d
cursor_text_color #0f052d
selection_background #5fc75d
selection_foreground #0f052d

# Colores de la terminal
# Negro / Gris
color0 #0f052d
color8 #203671
# Rojo
color1 #ff5555
color9 #ff9999
# Verde (El tuyo)
color2 #5fc75d
color10 #5fc75d
# Amarillo
color3 #f1fa8c
color11 #f1fa8c
# Azul
color4 #203671
color12 #203671
# Magenta
color5 #ff79c6
color13 #ff79c6
# Cyan (El tuyo)
color6 #36868f
color14 #36868f
# Blanco
color7 #f8f8f2
color15 #ffffff
